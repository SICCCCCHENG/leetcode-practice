<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var setZeroes = function (matrix) {
        let row_flag = false,
          col_flag = false;
        const m = matrix.length,
          n = matrix[0].length;
        debugger;
        for (let i = 0; i < n; i++) {
          if (matrix[0][i] === 0) {
            row_flag = true;
            break;
          }
        }
        for (let i = 0; i < m; i++) {
          if (matrix[i][0] === 0) {
            col_flag = true;
            break;
          }
        }
        for (let i = 0; i < m; i++) {
          for (let j = 0; j < n; j++) {
            if (matrix[i][j] === 0) {
              matrix[0][j] = 0;
              matrix[i][0] = 0;
            }
          }
        }
        for (let i = 0; i < m; i++) {
          for (let j = 0; j < n; j++) {
            if (i === 0 && col_flag) {
              matrix[0][j] = 0;
            } else if (j === 0 && row_flag) {
              matrix[i][0] = 0;
            } else if (matrix[i][0] === 0 || matrix[0][j] === 0) {
              matrix[i][j] = 0;
            }
          }
        }
      };
      setZeroes([
        [0, 1, 2, 0],
        [3, 4, 5, 2],
        [1, 3, 1, 5],
      ]);
    </script>
  </body>
</html>
